<title>Ding — komplett banane</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    background:#171009;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .frame{
    position:relative;
    /* New source images are square (988x988 after cropping the frame border). */
    width: min(100vw, 100vh);
    height: min(100vh, 100vw);
  }
  .frame img{
    position:absolute;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .base-img{ position:relative; z-index:0; }
  .reveal-img{
    z-index:1;
    opacity:0;
    transition: opacity 2.5s ease;
    pointer-events:none;
  }
  .reveal-toggle{
    position:absolute;
    opacity:0;
    pointer-events:none;
  }
  .reveal-toggle:checked ~ .reveal-img{
    opacity:1;
  }
  .hotspot{
    position:absolute;
    display:block;
  }
  .reveal-hotspot{
    left:0; top:0; width:100%; height:100%;
    cursor:pointer;
    z-index:1;
  }
  .door-zurueck{
    left: 12%; top: 22%;
    width: 15%; height: 32%;
    z-index: 3;
  }
  .door-garten{
    left: 70%; top: 22%;
    width: 20%; height: 32%;
    z-index: 3;
  }
  .door-garten-default{
    pointer-events: auto;
  }
  .door-garten-blue{
    pointer-events: none;
  }
  .reveal-toggle:checked ~ .door-garten-default{
    pointer-events: none;
  }
  .reveal-toggle:checked ~ .door-garten-blue{
    pointer-events: auto;
  }
  .hotspot:hover{
    outline: 1px solid rgba(242,183,5,0.45);
    background: rgba(242,183,5,0.08);
  }
</style>
