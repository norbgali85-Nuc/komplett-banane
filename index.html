<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komplett Banane — Werkstatt & Blütenfest</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Brevo CSS & JS -->
  <link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">
  <script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Space+Grotesk:wght@400;700&display=swap');
    
    body {
      background-color: #110f0d;
      color: #ece6da;
      font-family: 'Space Grotesk', sans-serif;
    }

    .font-oswald {
      font-family: 'Oswald', sans-serif;
    }

    /* Override Brevo Default Styles for Yellow/Black Design */
    #sib-container {
      background-color: #f1b300 !important;
      border: none !important;
      border-radius: 8px !important;
      padding: 1.5rem !important;
      max-width: 100% !important;
    }

    #sib-container input[type="text"], 
    #sib-container input[type="email"] {
      background-color: #110f0d !important;
      color: #ffffff !important;
      border: 2px solid #000000 !important;
      border-radius: 4px !important;
      padding: 0.75rem 1rem !important;
      font-weight: 700 !important;
    }

    #sib-container button.sib-form-block__button {
      background-color: #000000 !important;
      color: #f1b300 !important;
      font-family: 'Oswald', sans-serif !important;
      font-size: 1rem !important;
      letter-spacing: 1px !important;
      border-radius: 4px !important;
      padding: 0.75rem 1.5rem !important;
      text-transform: uppercase !important;
      font-weight: 900 !important;
    }

    #sib-container button.sib-form-block__button:hover {
      background-color: #26201b !important;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #110f0d; }
    ::-webkit-scrollbar-thumb { background: #26201b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #f1b300; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-yellow-400 selection:text-black">

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto px-4 py-8 flex-1 w-full space-y-10">
    
    <!-- Hero Title -->
    <section class="text-center space-y-4 pt-4">
      <div>
        <span class="inline-block bg-[#f1b300] text-black text-xs font-black px-3 py-1 uppercase tracking-wider rounded-sm">
          PROTOTYPING &amp; SCULPTURE LAB
        </span>
      </div>
      
      <h1 class="text-5xl sm:text-7xl font-oswald font-bold uppercase tracking-normal leading-none text-[#f1b300] py-1">
        KOMPLETT BANANE
      </h1>
      
      <div class="border-t border-b border-neutral-800 py-2.5 max-w-xl mx-auto">
        <p class="text-neutral-300 font-bold tracking-[0.2em] text-xs sm:text-sm uppercase">
          MODELLAGE · FORMENBAU · BLÜTENFEST
        </p>
      </div>
    </section>

    <!-- Sculpt Showcase / Gallery Viewer -->
    <section class="bg-[#1a1714] border-2 border-[#f1b300] rounded-lg overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-neutral-800 flex justify-between items-center bg-[#110f0d]/60">
        <div>
          <span class="text-[10px] uppercase text-[#f1b300] font-bold tracking-widest block">AKTUELLER SCULPT</span>
          <h2 id="view-title" class="text-base md:text-lg font-bold uppercase text-white">HORDAK CLAY SCULPT — PROTOTYP #01 (PROFIL 3/4)</h2>
        </div>
        <button id="fullscreen-btn" onclick="toggleFullscreen()" class="p-2 hover:bg-neutral-800 rounded text-neutral-400 hover:text-white transition-colors" title="Vollbild">
          <i data-lucide="maximize-2" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Main Image Frame -->
      <div class="relative aspect-4/3 md:aspect-16/10 bg-black flex items-center justify-center overflow-hidden">
        <img id="main-sculpt-img" 
             src="1000035246.jpg" 
             alt="Hordak Sculpt Prototype" 
             class="w-full h-full object-contain transition-all duration-200"
             onerror="this.onerror=null; this.src='https://placehold.co/800x600/1a1a1a/f1b300?text=1000035246.jpg';" />
      </div>

      <!-- Gallery Thumbnails (5 Ansichten) -->
      <div class="p-3 bg-[#110f0d] border-t border-neutral-800 grid grid-cols-5 gap-2">
        <button onclick="switchView(0)" class="thumb-btn border-2 border-[#f1b300] rounded overflow-hidden aspect-square bg-neutral-900 focus:outline-none">
          <img src="1000035246.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150/1a1a1a/f1b300?text=View+1';" />
        </button>
        <button onclick="switchView(1)" class="thumb-btn border-2 border-transparent hover:border-neutral-700 rounded overflow-hidden aspect-square bg-neutral-900 focus:outline-none">
          <img src="1000035245.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150/1a1a1a/f1b300?text=View+2';" />
        </button>
        <button onclick="switchView(2)" class="thumb-btn border-2 border-transparent hover:border-neutral-700 rounded overflow-hidden aspect-square bg-neutral-900 focus:outline-none">
          <img src="1000035244.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150/1a1a1a/f1b300?text=View+3';" />
        </button>
        <button onclick="switchView(3)" class="thumb-btn border-2 border-transparent hover:border-neutral-700 rounded overflow-hidden aspect-square bg-neutral-900 focus:outline-none">
          <img src="1000035220.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150/1a1a1a/f1b300?text=View+4';" />
        </button>
        <button onclick="switchView(4)" class="thumb-btn border-2 border-transparent hover:border-neutral-700 rounded overflow-hidden aspect-square bg-neutral-900 focus:outline-none">
          <img src="1000035216.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150/1a1a1a/f1b300?text=View+5';" />
        </button>
      </div>
    </section>

    <!-- Newsletter Section (Integriertes Brevo Formular) -->
    <section id="newsletter" class="bg-[#f1b300] text-black rounded-lg p-6 shadow-xl text-center space-y-3">
      <h2 class="text-2xl md:text-3xl font-black uppercase tracking-tight">
        AB UND ZU POST.
      </h2>
      <p class="text-neutral-900 font-bold text-sm md:text-base">
        Termine fürs Blütenfest &amp; seltene Einblicke in die Banane.
      </p>

      <!-- BREVO FORM CONTAINER -->
      <div id="sib-container" class="max-w-md mx-auto">
        <form id="sib-form" method="POST" action="https://6c05a257.sibforms.com/serve/MUIFAPqmlrySF_B4WU9K3hvu8s-Ajo8FffBwehwMbEJSb8EnuRpXiIzBkrBVOU55vXCDV1pLMHaT8oUNP2qyQu23tSMf3PcrHSMWB2IiOEqsOiYaH-rFDQPTgDb3nY64jwW7fA9GNk81IoVyAUjSR2ANx--RAU3xf1Qanr181Cmqra1IhqNEtIpQwm6Wa1o994PLyw8Uq_iTheATdw==" data-type="subscription">
          <div class="flex flex-col sm:flex-row gap-2">
            <input class="input" type="email" id="EMAIL" name="EMAIL" autocomplete="off" placeholder="deine@mail.de" data-required="true" required />
            <button class="sib-form-block__button" form="sib-form" type="submit">
              DABEISEIN
            </button>
          </div>
          <input type="text" name="email_address_check" value="" class="hidden">
          <input type="hidden" name="locale" value="de">
        </form>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="py-6 text-center text-xs text-neutral-500 space-y-2 border-t border-neutral-900 bg-[#0d0c0a]">
    <div>
      <a href="mailto:hallo@komplett-banane.de" class="hover:text-[#f1b300] transition-colors font-mono">hallo@komplett-banane.de</a>
    </div>
    <div class="flex justify-center gap-4 text-neutral-400">
      <button onclick="openModal('impressum')" class="hover:underline">Impressum</button>
      <span>·</span>
      <button onclick="openModal('datenschutz')" class="hover:underline">Datenschutz</button>
    </div>
    <p>&copy; 2026 Komplett Banane</p>
  </footer>

  <!-- Modal Container -->
  <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#1a1714] border-2 border-[#f1b300] max-w-xl w-full max-h-[80vh] rounded p-6 overflow-y-auto relative text-sm space-y-4">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-[#f1b300] font-bold">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const views = [
      { img: '1000035246.jpg', title: 'HORDAK CLAY SCULPT — PROTOTYP #01 (PROFIL 3/4)' },
      { img: '1000035245.jpg', title: 'HORDAK CLAY SCULPT — FRONTALANSICHT' },
      { img: '1000035244.jpg', title: 'HORDAK CLAY SCULPT — PERSPEKTIVE OBEN' },
      { img: '1000035220.jpg', title: 'HORDAK CLAY SCULPT — DETAIL ZÄHNE & HELM' },
      { img: '1000035216.jpg', title: 'HORDAK CLAY SCULPT — WERKSTATT & SETUP' }
    ];

    function switchView(index) {
      const mainImg = document.getElementById('main-sculpt-img');
      const viewTitle = document.getElementById('view-title');
      
      mainImg.src = views[index].img;
      viewTitle.innerText = views[index].title;

      const thumbs = document.querySelectorAll('.thumb-btn');
      thumbs.forEach((thumb, i) => {
        if (i === index) {
          thumb.classList.add('border-[#f1b300]');
          thumb.classList.remove('border-transparent');
        } else {
          thumb.classList.remove('border-[#f1b300]');
          thumb.classList.add('border-transparent');
        }
      });
    }

    function toggleFullscreen() {
      const img = document.getElementById('main-sculpt-img');
      if (img.requestFullscreen) {
        img.requestFullscreen();
      } else if (img.webkitRequestFullscreen) {
        img.webkitRequestFullscreen();
      }
    }

    function openModal(type) {
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      modal.classList.remove('hidden');

      if (type === 'impressum') {
        content.innerHTML = `
          <h2 class="text-xl font-black text-[#f1b300] mb-2 uppercase">IMPRESSUM</h2>
          <p class="text-neutral-300">Angaben gemäß § 5 TMG:</p>
          <p class="mt-2 text-neutral-400">
            <strong>Komplett Banane</strong><br>
            Norbert Galiger<br>
            Ortenburg, Deutschland<br>
            E-Mail: hallo@komplett-banane.de
          </p>
        `;
      } else if (type === 'datenschutz') {
        content.innerHTML = `
          <h2 class="text-xl font-black text-[#f1b300] mb-2 uppercase">DATENSCHUTZ</h2>
          <p class="text-neutral-300">1. Datenschutz auf einen Blick</p>
          <p class="mt-1 text-neutral-400 text-xs">
            Wir verarbeiten personenbezogene Daten (E-Mail-Adresse) ausschließlich zum Versand unseres Newsletters über Brevo (DSGVO-konform). Die Einwilligung kann jederzeit widerrufen werden.
          </p>
        `;
      }
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    window.REQUIRED_CODE_ERROR_MESSAGE = 'Bitte wählen Sie eine Vorwahl aus.';
    window.LOCALE = 'de';
    window.EMAIL_INVALID_MESSAGE = window.SMS_INVALID_MESSAGE = "Bitte überprüfen Sie das E-Mail-Format.";
    window.REQUIRED_ERROR_MESSAGE = "Dieses Feld darf nicht leer sein.";
    window.GENERIC_INVALID_MESSAGE = "Ungültige Eingabe.";
  </script>
</body>
</html>
